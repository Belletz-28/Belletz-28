<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Belletz-28 · Full Stack &amp; Forward Deployed AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151b3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#7c5cff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
    .sans { font-family: 'Inter', 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow)"/>

  <g class="mono" font-size="16" fill="#8b93b8">
    <circle cx="64" cy="58" r="6" fill="#ff5f57"/>
    <circle cx="86" cy="58" r="6" fill="#febc2e"/>
    <circle cx="108" cy="58" r="6" fill="#28c840"/>
    <text x="134" y="63">~/belletz-28 $ whoami</text>
  </g>

  <text x="60" y="150" class="sans" font-size="64" font-weight="800" fill="#f5f7ff" letter-spacing="-1">Belletz-28<tspan class="cursor" fill="#22d3ee">_</tspan></text>
  <rect x="62" y="172" width="340" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="60" y="218" class="sans" font-size="26" font-weight="600" fill="#c9cff0">Full Stack &amp; Forward Deployed AI Engineer</text>
  <text x="60" y="254" class="mono" font-size="17" fill="#8b93b8">Founder @ CBM-Solutions  ·  idea → production  ·  agents · RAG · platforms</text>

  <g transform="translate(930 150)" fill="none" stroke-width="2">
    <circle r="78" stroke="#7c5cff" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
    </circle>
    <circle r="52" stroke="#22d3ee" stroke-opacity="0.6" stroke-dasharray="2 8">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="25s" repeatCount="indefinite"/>
    </circle>
    <text y="12" text-anchor="middle" class="mono" font-size="34" font-weight="700" fill="#f5f7ff" stroke="none">&lt;/&gt;</text>
  </g>
</svg>
